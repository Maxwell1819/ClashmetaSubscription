[custom]
enable_rule_generator=true
overwrite_original_rules=true

exclude=流量|续费|套餐|到期|剩余|重置|官网|网站|最新网址|失联|公告|通知|TG|Telegram|电报|群|频道|说明|QQ|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

