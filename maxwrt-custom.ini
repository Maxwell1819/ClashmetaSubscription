[custom]
; ==========================================================
; 方案 B 在方案a上，所有应用层增加手动 自动选择。
; 档 A 重构（2026-11）：
;   1) cn / GEOIP,cn 兜底下移到应用规则之后，避免抢走应用组域名
;   2) 私网直连改用 GEOIP,LAN（mmdb 模式下 GEOIP,private 不生效）
;   3) 删除被 category-ai-!cn 完全覆盖的规则，清理失效分组
;   4) 国家测速组正则换用完整关键词（城市名 / IATA 三字码）
;   5) 手动选择合并为「🚀 手动选择」一个入口（末尾 .* 收录全部节点）
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; （已去重：官网⊃官网地址、失联⊃防失联、说明⊃使用说明、群⊃QQ群）
; ==========================================================
exclude=流量|续费|套餐|到期|剩余|重置|官网|网站|最新网址|失联|公告|通知|TG|Telegram|电报|群|频道|说明|QQ|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; --- 广告拦截（最高优先） ---
ruleset=REJECT,[]GEOSITE,category-ads-all
ruleset=🟥 Adobe,[]GEOSITE,adobe

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,LAN,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（仅兜底用，不越权）---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内可用 / 下载 / BT（必须早于应用规则，否则会被应用组截走） ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 核心应用 ---
ruleset=📦 Notion,[]GEOSITE,Notion

ruleset=📨 Telegram,[]GEOSITE,telegram
; 说明：GEOIP 服务名（telegram/netflix/google/cloudflare）只在 geodata 模式
;       （加载 GeoIP.dat）下成立；用 Country.mmdb 时不报错但也不会命中。
ruleset=📨 Telegram,[]GEOIP,telegram,no-resolve

ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
; 说明：Gemini / Claude / Copilot / Grok 均已包含在 category-ai-!cn 内，不再单独列规则

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🎥 Netflix,[]GEOIP,netflix,no-resolve

; --- 海外主流应用补充 ---
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 交易所 & Adobe（全部走 GEOSITE）---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit
; ==========================================================
; --- 若使用上方geo没有匹配到可以用下方url来匹配，需先在上方删除该应用的ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================
; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=↔️ teamviewer,[]GEOSITE,teamviewer

; --- Google / Microsoft（新增） ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare
ruleset=☁️ cloudflare,[]GEOIP,cloudflare,no-resolve

ruleset=🔎 Google,[]GEOSITE,google
ruleset=🔎 Google,[]GEOIP,google,no-resolve

ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- 国内域名 / IP 兜底 ---
; 放在应用之后：cn 名单与应用名单存在交集，放前面会让 Apple/Microsoft/Adobe 等组对部分域名失效
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- GFW 兜底（还原 passwall2：非中国域名/IP 走代理） ---
ruleset=🚀 手动选择,[]GEOSITE,geolocation-!cn
ruleset=🚀 手动选择,[]GEOIP,!cn,no-resolve
; 个人补充域名（不属于 AI，单独放这里，避免污染 🧠 AI 分组）
ruleset=🚀 手动选择,[]DOMAIN-SUFFIX,hstream.moe

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不越权）
;    说明：
;      - 「🚀 手动选择」是唯一的手动入口，内部含全节点 + DIRECT
;      - 每组结尾 `.*` 追加全部节点，任何地区的新节点都能直接选
;      - 「🧊 冷门节点」只保留在 Default / 手动选择里，避免空组风险
; ==========================================================
custom_proxy_group=📦 Notion`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🍎 Apple`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🤖 ChatGPT`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🧠 AI`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📨 Telegram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📞 即时通讯`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=💬 社交媒体`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=↔️ teamviewer`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🎬 YouTube`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🎥 Netflix`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🎵 TikTok`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📸 Instagram`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🐦 X`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🧑‍💻 GitHub`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🟦 OKX`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]DIRECT`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🟨 Binance`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🟪 Bybit`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*

; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]DIRECT`[]REJECT`[]🌐 Default`.*
custom_proxy_group=🔎 Google`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=☁️ cloudflare`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🚀 手动选择`[]♻️ 自动选择`[]🌐 Default`.*
; Microsoft：允许直连优先，同时也能选五区/手动/Default
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]♻️ 自动选择`[]🚀 手动选择`[]🌐 Default`.*

; ==========================================================
; 3) Default / 漏网之鱼（唯一允许全节点）
; ==========================================================

; 兜底「手动选择」：规则兜底 + 全节点手动入口（唯一手动组）
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]DIRECT`.*

; Default 出口（同样允许冷门节点参与）
custom_proxy_group=🌐 Default`select`[]🇭🇰 HK`[]🇹🇼 TW`[]🇯🇵 JP`[]🇸🇬 SG`[]🇺🇸 US`[]🧊 冷门节点`[]♻️ 自动选择`[]🚀 手动选择`[]DIRECT`.*

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点`[]🚀 手动选择


; ==========================================================
; 4) 非标端口（直接指向漏网之鱼，不再中转）
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 漏网之鱼`[]DIRECT


; ==========================================================
; 5) 国家节点测速组
; ==========================================================
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 HK`url-test`(?i)(🇭🇰|香港|九龙|新界|沙田|荃湾|葵涌|深港|\bHK[-_ ]?\d*\b|\bhong\s?kong\b|\bhkg\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 TW`url-test`(?i)(🇹🇼|🇼🇸|台湾|台北|台中|新北|彰化|\bTW[-_ ]?\d*\b|\btaiwan\b|\btaipei\b|\btwn\b|\btpe\b|\bhinet\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 JP`url-test`(?i)(🇯🇵|日本|东京|大阪|川日|泉日|沪日|深日|埼玉|关西|(?<!尼|-)日|\bJP[-_ ]?\d*\b|\bjapan\b|\bjpn\b|\bnrt\b|\bhnd\b|\bkix\b|\btyo\b|\bosa\b|\bkansai\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 SG`url-test`(?i)(🇸🇬|新加坡|狮城|坡|\bSG[-_ ]?\d*\b|\bsingapore\b|\bsin\b)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 US`url-test`(?i)(🇺🇸|美国|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|华盛顿|达拉斯|凤凰城|硅谷|拉斯维加斯|波特兰|俄勒冈|迈阿密|亚特兰大|\bUS[-_ ]?\d*\b|\bunited\s?states\b|\busa\b|\bamerica\b|\bjfk\b|\bewr\b|\biad\b|\batl\b|\bord\b|\bmia\b|\bnyc\b|\blax\b|\bsfo\b|\bsea\b|\bdfw\b|\bsjc\b)`http://www.gstatic.com/generate_204`300,,50
; 冷门节点池（排除 HK/TW/JP/SG/US）——selector 手动选择
; 说明：用负向匹配把五大区节点剔除，剩余即"冷门"；关键词与上方测速组保持一致
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(?:🇭🇰|香港|九龙|新界|沙田|荃湾|葵涌|深港|\bHK[-_ ]?\d*\b|\bhong\s?kong\b|\bhkg\b|🇹🇼|🇼🇸|台湾|台北|台中|新北|彰化|\bTW[-_ ]?\d*\b|\btaiwan\b|\btaipei\b|\btwn\b|\btpe\b|\bhinet\b|🇯🇵|日本|东京|大阪|川日|泉日|沪日|深日|埼玉|关西|(?<!尼|-)日|\bJP[-_ ]?\d*\b|\bjapan\b|\bjpn\b|\bnrt\b|\bhnd\b|\bkix\b|\btyo\b|\bosa\b|\bkansai\b|🇸🇬|新加坡|狮城|坡|\bSG[-_ ]?\d*\b|\bsingapore\b|\bsin\b|🇺🇸|美国|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|华盛顿|达拉斯|凤凰城|硅谷|拉斯维加斯|波特兰|俄勒冈|迈阿密|亚特兰大|\bUS[-_ ]?\d*\b|\bunited\s?states\b|\busa\b|\bamerica\b|\bjfk\b|\bewr\b|\biad\b|\batl\b|\bord\b|\bmia\b|\bnyc\b|\blax\b|\bsfo\b|\bsea\b|\bdfw\b|\bsjc\b)).*
